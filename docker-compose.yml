version: '3.8'

services:
  db:
    image: postgres:15
    container_name: notes_db
    restart: always
    environment:
      POSTGRES_USER: amanlal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: notes_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_USER: amanlal
      DB_HOST: db
      DB_NAME: notes_db
      DB_PASSWORD: password
      DB_PORT: 5432
      JWT_SECRET: super_secret_key

volumes:
  postgres_data: